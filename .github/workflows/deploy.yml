name: Deploy Monorepo
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install 

      - name: Build All Apps
        run: |
          npm run build -w to-do-app
          npm run build -w excuse-app
          npm run build -w toggle-switch

      - name: Organize Files
        run: |
          mkdir out
          cp -r to-do-app/dist ./out/to-do-app
          cp -r excuse-app/dist ./out/excuse-app
          cp -r toggle-switch/dist ./out/toggle-switch

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out